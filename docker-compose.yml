services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      AGENTSIGNAL_STORAGE: postgres
      DATABASE_URL: postgres://agentsignal:${POSTGRES_PASSWORD}@db:5432/agentsignal
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentsignal
      POSTGRES_USER: agentsignal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - agentsignal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentsignal -d agentsignal"]
      interval: 5s
      timeout: 5s
      retries: 10
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./selfhost/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  agentsignal_data:
  caddy_data:
  caddy_config:
